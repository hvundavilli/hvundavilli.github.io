<body data-page="home">

  <header class="hero-slides" aria-label="Fieldwork photographs">
    <div class="slide s1 on"></div>
    <div class="slide s2"></div>
    <div class="slide s3"></div>
    <div class="slide s4"></div>
    <div class="slide s5"></div>
    <span class="slide-caption on"></span>
    <span class="slide-caption"></span>
    <span class="slide-caption"></span>
    <span class="slide-caption"></span>
    <span class="slide-caption"></span>
    <div class="scrim"></div>
    <div class="hero-text">
      <div class="site-name"></div>
      <div class="site-sub"></div>
    </div>
  </header>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var slides = document.querySelectorAll('.hero-slides .slide');
      var caps = document.querySelectorAll('.hero-slides .slide-caption');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var i = 0;
      setInterval(function () {
        slides[i].classList.remove('on'); caps[i].classList.remove('on');
        i = (i + 1) % slides.length;
        slides[i].classList.add('on'); caps[i].classList.add('on');
      }, 5500);
    });
  </script>
